<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>WilTasks Admin</title>

<style>
:root{
--pri:#1d4ed8;
--bg:#eff6ff;
--tx:#0f172a;
--mut:#64748b;
--bd:#dbe4f3;
--ok:#16a34a;
--bad:#dc2626;
--warn:#b45309
}
*{box-sizing:border-box}
body{
margin:0;
font:15px/1.45 system-ui,sans-serif;
background:var(--bg);
color:var(--tx);
padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))
}
.w{max-width:700px;margin:auto;padding:0 14px 14px}
header{
position:sticky;
top:0;
z-index:5;
background:var(--bg);
display:flex;
align-items:center;
justify-content:space-between;
padding:calc(12px + env(safe-area-inset-top,0px)) 0 10px
}
h1{font-size:1.2rem;margin:0}
h2{font-size:1.05rem;margin:0 0 10px}
.card{
background:#fff;
border-radius:16px;
padding:14px;
margin:10px 0;
box-shadow:0 2px 8px #1d4ed814
}
button{
background:var(--pri);
color:#fff;
border:0;
border-radius:10px;
padding:11px 14px;
min-height:44px;
font:inherit;
font-weight:700;
cursor:pointer
}
button.r{background:var(--bad)}
button.g{background:var(--ok)}
button.o{
background:#fff;
color:var(--pri);
border:1px solid var(--bd)
}
.sm{min-height:36px;padding:6px 12px;font-size:.85rem}
.row{display:flex;gap:8px;margin-top:8px}
.row>button{flex:1}
input,textarea,select{
width:100%;
padding:11px;
margin:4px 0;
border:1px solid #cbd5e1;
border-radius:10px;
font:inherit;
background:#fff;
color:var(--tx)
}
textarea{min-height:85px;resize:vertical}
img{max-width:100%;border-radius:10px;margin-top:8px}
small,.mut{color:var(--mut)}
.hide{display:none}
.top{
display:flex;
justify-content:space-between;
gap:8px;
align-items:flex-start
}
.tag{
display:inline-block;
border-radius:99px;
padding:2px 10px;
font-size:.78rem;
font-weight:700;
background:#e0e9fb;
color:var(--pri)
}
.tag.p{background:#fef3c7;color:var(--warn)}
.tag.on{background:#dcfce7;color:var(--ok)}
.tag.off{background:#e2e8f0;color:var(--mut)}
.tag.b{background:#fee2e2;color:var(--bad)}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}
.stat{
background:#fff;
border-radius:16px;
padding:14px;
box-shadow:0 2px 8px #1d4ed814;
cursor:pointer
}
.stat b{display:block;font-size:1.8rem;line-height:1.1}
code{
word-break:break-all;
background:var(--bg);
padding:2px 6px;
border-radius:6px
}
.pay{
background:var(--bg);
border-radius:10px;
padding:10px;
margin-top:8px
}
nav{
position:fixed;
left:0;
right:0;
bottom:0;
z-index:6;
background:#fff;
border-top:1px solid var(--bd);
display:flex;
padding-bottom:env(safe-area-inset-bottom,0px)
}
nav button{
flex:1;
background:none;
color:var(--mut);
border-radius:0;
min-height:62px;
padding:6px 2px;
font-size:.72rem;
font-weight:600;
position:relative;
display:flex;
flex-direction:column;
align-items:center;
gap:2px
}
nav button i{
font-style:normal;
font-size:1.35rem;
line-height:1
}
nav button.on{color:var(--pri)}
.bd{
position:absolute;
top:4px;
left:calc(50% + 6px);
background:var(--bad);
color:#fff;
border-radius:99px;
min-width:18px;
padding:0 5px;
font-size:.7rem;
line-height:18px;
text-align:center
}
.menu{
position:absolute;
right:0;
top:100%;
background:#fff;
border-radius:12px;
box-shadow:0 6px 20px #0f172a30;
padding:6px;
z-index:9
}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.form-title{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px
}
</style>
</head>

<body>
<div class="w">

<header>
<h1 id="ti">🔒 WilTasks · Admin</h1>

<div id="mw" class="hide" style="position:relative">
<button class="o sm" onclick="$('mn').classList.toggle('hide')" aria-label="Menu">⋮</button>

<div id="mn" class="menu hide">
<button class="r sm" onclick="sb.auth.signOut().then(()=>location.reload())">Sair</button>
</div>
</div>
</header>

<div id="lg" class="card">
<input id="em" type="email" placeholder="E-mail admin" autocomplete="username">
<input id="pw" type="password" placeholder="Palavra-passe" autocomplete="current-password">
<button style="width:100%;margin-top:6px" onclick="login()">Entrar</button>
</div>

<div id="v"></div>

</div>

<nav id="nv" class="hide">

<button data-t="home" onclick="setT('home')">
<i>🏠</i>Início
</button>

<button data-t="sub" onclick="setT('sub')">
<i>✅</i>Enviadas
<span id="b1" class="bd hide"></span>
</button>

<button data-t="wd" onclick="setT('wd')">
<i>💸</i>Saques
<span id="b2" class="bd hide"></span>
</button>

<button data-t="tk" onclick="setT('tk')">
<i>📋</i>Tarefas
</button>

<button data-t="us" onclick="setT('us')">
<i>👥</i>Utilizadores
</button>

</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>

<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=i=>document.getElementById(i);

let t='home';
let wf='pending';
let tf='all';
let q='';
let U=[];
let TASKS=[];
let editingId=null;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c]));

const TT={
home:'Início',
sub:'Tarefas enviadas',
wd:'Saques',
tk:'Tarefas',
us:'Utilizadores'
};

const setT=x=>{
t=x;
go()
};

const cp=v=>navigator.clipboard.writeText(v).then(
()=>alert('Copiado'),
()=>prompt('Copie:',v)
);

async function login(){
const r=await sb.auth.signInWithPassword({
email:$('em').value,
password:$('pw').value
});

if(r.error)return alert(r.error.message);

boot()
}

async function boot(){
const{data:{user}}=await sb.auth.getUser();

if(!user)return;

const{data:p,error}=await sb
.from('profiles')
.select('is_admin')
.eq('id',user.id)
.single();

if(error||!p?.is_admin){
await sb.auth.signOut();
return alert('Acesso negado');
}

$('lg').classList.add('hide');
$('nv').classList.remove('hide');
$('mw').classList.remove('hide');

go()
}

const run=async(fn,a)=>{
const r=await sb.rpc(fn,a);

if(r.error){
alert(r.error.message);
return
}

go()
};

const cnt=async(tb,f)=>{
let x=sb.from(tb).select('id',{count:'exact',head:true});

if(f)x=f(x);

const r=await x;

return r.count||0
};

const bdg=(id,n)=>{
const e=$(id);
e.textContent=n;
e.classList.toggle('hide',!n)
};

async function badges(){
const[s,w]=await Promise.all([
cnt('submissions',x=>x.eq('status','pending')),
cnt('withdrawals',x=>x.eq('status','pending'))
]);

bdg('b1',s);
bdg('b2',w);

return[s,w]
}

const tagS=s=>`
<span class="tag ${s=='pending'?'p':''}">
${s=='pending'?'Pendente':esc(s)}
</span>
`;

async function go(){

$('mn').classList.add('hide');

$('ti').textContent=
t=='home'?'🔒 WilTasks · Admin':TT[t];

document.querySelectorAll('nav button').forEach(b=>{
b.classList.toggle('on',b.dataset.t==t)
});

$('v').innerHTML='<p class="mut">A carregar…</p>';

let h='';

/* INÍCIO */

if(t=='home'){

const[[s,w],u,k]=await Promise.all([
badges(),
cnt('profiles'),
cnt('tasks',x=>x.eq('active',true))
]);

h=`
<div class="grid">

<div class="stat" onclick="setT('sub')">
<b>${s}</b>
Tarefas por aprovar
</div>

<div class="stat" onclick="setT('wd')">
<b>${w}</b>
Saques pendentes
</div>

<div class="stat" onclick="setT('us')">
<b>${u}</b>
Utilizadores
</div>

<div class="stat" onclick="setT('tk')">
<b>${k}</b>
Tarefas ativas
</div>

</div>
`;
}

/* TAREFAS ENVIADAS */

if(t=='sub'){

badges();

const{data,error}=await sb
.from('submissions')
.select('*,tasks(title,reward),profiles(name,email)')
.eq('status','pending')
.order('created_at');

if(error){

h=`<p>${esc(error.message)}</p>`;

}else{

for(const s of data){

const u=await sb.storage
.from('proofs')
.createSignedUrl(s.photo_path,600);

h+=`
<div class="card">

<div class="top">
<b>${esc(s.tasks.title)}</b>
<span class="tag">${s.tasks.reward} USDT</span>
</div>

<small>
${esc(s.profiles.name)}
(${esc(s.profiles.email)})
</small>

<br>

<a href="${u.data?.signedUrl}" target="_blank">
<img src="${u.data?.signedUrl}">
</a>

<textarea id="r${s.id}" placeholder="Motivo (obrigatório para rejeitar)"></textarea>

<div class="row">

<button class="g" onclick="run('review_submission',{
sid:'${s.id}',
approve:true,
why:null
})">
Aprovar
</button>

<button class="r" onclick="rej('${s.id}')">
Rejeitar
</button>

</div>
</div>
`
}

h=h||'<div class="card mut">Nada pendente.</div>'
}
}

/* SAQUES */

if(t=='wd'){

badges();

const{data,error}=await sb
.from('withdrawals')
.select('*,profiles(name,email)')
.order('created_at',{ascending:false});

if(error){

h=`<p>${esc(error.message)}</p>`;

}else{

const L=wf=='pending'
?data.filter(w=>w.status=='pending')
:data;

h=`

<details class="card">

<summary><b>Taxa: MZN por 1 USDT</b></summary>

<input id="rt" type="number" step="0.01" placeholder="Ex: 70">

<button style="width:100%;margin-top:6px"
onclick="run('set_rate',{r:parseFloat($('rt').value)})">
Guardar taxa
</button>

</details>

<div class="chips">

<button class="sm ${wf=='pending'?'':'o'}"
onclick="wf='pending';go()">
Pendentes
</button>

<button class="sm ${wf=='all'?'':'o'}"
onclick="wf='all';go()">
Todos
</button>

</div>
`;

h+=L.map(w=>{

const em=w.method=='emola';

return`

<div class="card">

<div class="top">

<b>${w.amount} USDT</b>

<span>
${tagS(w.status)}
<span class="tag">${em?'e-Mola':'BEP20'}</span>
</span>

</div>

<small>
${esc(w.profiles.name)}
· ${new Date(w.created_at).toLocaleString('pt')}
</small>

<div class="pay">

${em
?`<b>Pagar ${w.mzn} MZN</b> para e-Mola
<code>${esc(w.phone)}</code>
<br><small>Taxa ${w.rate}</small>`
:`<code>${esc(w.wallet)}</code>`
}

<div class="row">

<button class="o sm"
data-v="${esc(em?w.phone:w.wallet)}"
onclick="cp(this.dataset.v)">
Copiar ${em?'número':'endereço'}
</button>

</div>

</div>

${w.status=='pending'?`

<input id="x${w.id}"
placeholder="Hash BEP20 ou ID da transação e-Mola">

<div class="row">

<button class="g"
onclick="run('resolve_withdrawal',{
wid:'${w.id}',
paid:true,
tx:$('x${w.id}').value
})">
Marcar como pago
</button>

<button class="r"
onclick="run('resolve_withdrawal',{
wid:'${w.id}',
paid:false,
tx:null
})">
Rejeitar
</button>

</div>

`:w.txhash?'<small>Tx: '+esc(w.txhash)+'</small>':''}

</div>

`

}).join('')||'<div class="card mut">Sem levantamentos.</div>';

}
}

/* TAREFAS */

if(t=='tk'){

const{data,error}=await sb
.from('tasks')
.select('*')
.order('created_at',{ascending:false});

if(error){

h=`<p>${esc(error.message)}</p>`;

}else{

TASKS=data||[];

h=`

<div class="row" style="margin-top:0">

<button onclick="newT(0)">
+ Tarefa normal
</button>

<button class="g" onclick="newT(1)">
⭐ + Tarefa premium
</button>

</div>

<div class="chips" style="margin-top:10px">

<button class="sm ${tf=='all'?'':'o'}"
onclick="tf='all';go()">
Todas
</button>

<button class="sm ${tf=='n'?'':'o'}"
onclick="tf='n';go()">
Normais
</button>

<button class="sm ${tf=='p'?'':'o'}"
onclick="tf='p';go()">
⭐ Premium
</button>

</div>

<div id="nf" class="card hide">

<div class="form-title">
<h2 id="formTitle">Criar tarefa</h2>

<button class="o sm" onclick="cancelEdit()">
Fechar
</button>
</div>

<label>Categoria da tarefa</label>

<select id="tprem" onchange="defaultReward()">

<option value="0">Tarefa normal</option>

<option value="1">⭐ Tarefa premium</option>

</select>

<label>Título</label>
<input id="tt" placeholder="Título da tarefa">

<label>Tipo de tarefa</label>

<select id="ttype" onchange="chType()">

<option value="texto">Simples (só texto)</option>

<option value="link">Link</option>

<option value="copiar">Copiar dados</option>

</select>

<label>Instruções</label>
<textarea id="td" placeholder="Instruções da tarefa"></textarea>

<div id="f_link" class="hide">
<label>Link da tarefa</label>
<input id="tl" placeholder="URL (https://...)">
</div>

<div id="f_copiar" class="hide">

<label>Nome</label>
<input id="tn" placeholder="Nome">

<label>Sobrenome</label>
<input id="ts" placeholder="Sobrenome">

<label>E-mail</label>
<input id="te" placeholder="E-mail">

<label>Senha</label>
<input id="tp" placeholder="Senha">

</div>

<label>Recompensa em USDT</label>

<input id="tr" type="number" min="0.01" step="0.01" placeholder="0.03">

<small>
Valor inicial: 0,03 USDT normal ou 0,05 USDT premium.
Podes alterar manualmente.
</small>

<label style="display:block;margin-top:10px">
Número de vagas
</label>

<input id="tsl" type="number" min="1" step="1" value="1">

<button id="saveTaskBtn"
style="width:100%;margin-top:8px"
onclick="saveT()">
Criar tarefa
</button>

<button class="o"
style="width:100%;margin-top:8px"
onclick="cancelEdit()">
Cancelar
</button>

</div>

`;

h+=TASKS
.filter(k=>tf=='all'||(tf=='p')==!!k.premium)
.map(k=>`

<div class="card">

<div class="top">

<b>${esc(k.title)}</b>

<span>

${k.premium?'<span class="tag p">⭐ Premium</span> ':''}

<span class="tag ${k.active?'on':'off'}">
${k.active?'Ativa':'Inativa'}
</span>

</span>

</div>

<small>
${k.reward} USDT ·
${esc(k.kind||'texto')} ·
${k.slots||1} vaga(s)
</small>

<div class="row">

<button class="o" onclick="editT('${k.id}')">
✏️ Editar
</button>

<button class="${k.active?'o':'g'}"
onclick="tog('${k.id}',${!k.active})">
${k.active?'Desativar':'Ativar'}
</button>

</div>

<div class="row">

<button class="r" onclick="del('${k.id}')">
Eliminar
</button>

</div>

</div>

`).join('')||'<div class="card mut">Ainda não há tarefas.</div>';

}
}

/* UTILIZADORES */

if(t=='us'){

const{data,error}=await sb
.from('profiles')
.select('*')
.order('created_at',{ascending:false});

if(error){

h=`<p>${esc(error.message)}</p>`;

}else{

U=data||[];

h=`

<input id="sq"
placeholder="Pesquisar por nome ou e-mail"
value="${esc(q)}"
oninput="q=this.value;drawU()">

<div id="ul"></div>

`
}
}

$('v').innerHTML=h;

if(t=='us'&&U.length)drawU();

}

/* UTILIZADORES: PESQUISA */

function drawU(){

const s=q.trim().toLowerCase();

$('ul').innerHTML=U
.filter(u=>
!s||
(u.name||'').toLowerCase().includes(s)||
(u.email||'').toLowerCase().includes(s)
)
.map(u=>`

<div class="card">

<div class="top">

<b>${esc(u.name)}</b>

<span>

${u.blocked?'<span class="tag b">Bloqueado</span>':''}

${u.is_admin?' <span class="tag">Admin</span>':''}

</span>

</div>

<small>${esc(u.email)}</small>

<br>

<small>
Saldo ${u.balance} ·
Violações ${u.violations} ·
Convite de ${esc(u.invited_by||'-')}
</small>

${u.is_admin?'':`

<div class="row">

<button class="${u.blocked?'':'r'}"
onclick="run('moderate_user',{
uid:'${u.id}',
block:${!u.blocked},
add_violation:false
})">

${u.blocked?'Desbloquear':'Bloquear'}

</button>

<button class="o"
onclick="run('moderate_user',{
uid:'${u.id}',
block:${u.blocked},
add_violation:true
})">

+ Violação

</button>

</div>

`}

</div>

`).join('')||'<div class="card mut">Nenhum utilizador encontrado.</div>';

}

/* REJEITAR TAREFA */

function rej(id){

const w=$('r'+id).value.trim();

if(!w)return alert('Indique o motivo da rejeição.');

run('review_submission',{
sid:id,
approve:false,
why:w
});

}

/* VALOR PADRÃO */

function defaultReward(){

const premium=$('tprem').value=='1';

$('tr').value=premium?'0.05':'0.03';

}

/* NOVA TAREFA */

function newT(p){

editingId=null;

$('nf').classList.remove('hide');

$('formTitle').textContent='Criar tarefa';

$('saveTaskBtn').textContent='Criar tarefa';

$('tprem').value=p?'1':'0';

$('tt').value='';
$('td').value='';
$('ttype').value='texto';

$('tl').value='';
$('tn').value='';
$('ts').value='';
$('te').value='';
$('tp').value='';

$('tsl').value='1';

defaultReward();

chType();

$('tt').focus();

}

/* EDITAR TAREFA */

function editT(id){

const k=TASKS.find(x=>x.id==id);

if(!k)return alert('Tarefa não encontrada.');

editingId=id;

$('nf').classList.remove('hide');

$('formTitle').textContent='Editar tarefa';

$('saveTaskBtn').textContent='Guardar alterações';

$('tprem').value=k.premium?'1':'0';

$('tt').value=k.title||'';

$('td').value=k.description||'';

$('ttype').value=k.kind||'texto';

$('tr').value=k.reward??'0.03';

$('tsl').value=k.slots||1;

const extra=k.extra||{};

$('tl').value=extra.url||'';

$('tn').value=extra.nome||'';

$('ts').value=extra.sobrenome||'';

$('te').value=extra.email||'';

$('tp').value=extra.senha||'';

chType();

$('nf').scrollIntoView({
behavior:'smooth',
block:'start'
});

}

/* CANCELAR EDIÇÃO */

function cancelEdit(){

editingId=null;

$('nf').classList.add('hide');

}

/* MOSTRAR CAMPOS CONFORME TIPO */

function chType(){

const k=$('ttype').value;

$('f_link').classList.toggle('hide',k!='link');

$('f_copiar').classList.toggle('hide',k!='copiar');

}

/* CRIAR OU ATUALIZAR TAREFA */

async function saveT(){

const title=$('tt').value.trim();

const description=$('td').value.trim();

const kind=$('ttype').value;

const premium=$('tprem').value=='1';

const reward=parseFloat($('tr').value);

const slots=parseInt($('tsl').value);

if(!title)return alert('Escreva o título da tarefa.');

if(!description)return alert('Escreva as instruções.');

if(!Number.isFinite(reward)||reward<=0)
return alert('Indique uma recompensa válida.');

if(!Number.isInteger(slots)||slots<1)
return alert('O número de vagas deve ser pelo menos 1.');

let extra={};

if(kind=='link'){

const url=$('tl').value.trim();

if(!url)return alert('Insira o link da tarefa.');

try{
new URL(url);
}catch(e){
return alert('O link não é válido.');
}

extra={url};

}

if(kind=='copiar'){

extra={
nome:$('tn').value.trim(),
sobrenome:$('ts').value.trim(),
email:$('te').value.trim(),
senha:$('tp').value
};

}

const payload={
title,
description,
reward,
kind,
extra,
slots,
premium
};

let r;

if(editingId){

r=await sb
.from('tasks')
.update(payload)
.eq('id',editingId);

}else{

r=await sb
.from('tasks')
.insert(payload);

}

if(r.error){

alert('Erro: '+r.error.message);

return;

}

alert(editingId
?'Tarefa atualizada com sucesso!'
:'Tarefa criada com sucesso!');

editingId=null;

go();

}

/* ELIMINAR TAREFA */

async function del(id){

if(!confirm('Eliminar esta tarefa de forma definitiva?'))
return;

const r=await sb
.from('tasks')
.delete()
.eq('id',id)
.select();

if(r.error){

alert(
r.error.code=='23503'
?'Esta tarefa já tem envios de utilizadores e não pode ser eliminada. Desative-a em vez disso.'
:r.error.message
);

}else if(!r.data.length){

alert('Não foi possível eliminar: sem permissão na base de dados.');

}

go();

}

/* ATIVAR OU DESATIVAR */

async function tog(id,a){

const r=await sb
.from('tasks')
.update({active:a})
.eq('id',id);

if(r.error){

alert(r.error.message);

return;

}

go();

}

/* INICIAR */

boot();
